name: Buscar passagens
on:
  schedule:
    - cron: "0 */3 * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  buscar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python buscar.py
        env:
          TP_TOKEN: ${{ secrets.TP_TOKEN }}
          TP_MARKER: ${{ secrets.TP_MARKER }}
      - run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add data/ofertas.json
          git diff --cached --quiet || (git commit -m "atualiza ofertas" && git push)
